{% extends "base.html" %}

{% block content %}
<h2>All Available Books</h2>
{% for book in object_list %}
<div>
    <h3>{{book.title}}</h3>
    <p>{{book.author}}</p>
    <p>{{book.price}}</p>
    <p>
     <a href="{% url 'detail' book.id %}">View Details</a>
    </p>
</div>
{% endfor %}
{% endblock content %}
